<div class="stats-row grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">

  <div class="stat-card relative bg-white rounded-xl shadow-sm p-4 flex flex-col gap-2 w-86 h-30" *ngFor="let stat of stats; let i = index">

    <div class="stat-label text-sm font-semibold text-gray-600 flex items-center gap-1">
      {{ stat.label }}

      <!-- Tooltip only for 2nd & 3rd -->
      <div class="relative group" *ngIf="i !== 0">

        <img src="assets/icons/badges/help-icon-with-tooltip.svg" class="w-4 h-4 cursor-pointer" />

        <!-- Tooltip -->
        <div class="tooltip-box">
          {{ i === 1 ? tooltipText1 : tooltipText2 }}
          <div class="tooltip-arrow"></div>
        </div>

      </div>
    </div>

    <div class="stat-icon w-12 h-12 rounded-lg flex items-center justify-center self-end "  [ngClass]="stat?.iconClass">
      <img class="w-8 h-8" [src]="stat.icon" />
    </div>

    <div class="stat-value text-2xl font-semibold">
      {{ stat.value }} <span *ngIf="stat.label === 'Badge Completion Rate' && stat.value !== null">%</span>
    </div>

  </div>
</div>
